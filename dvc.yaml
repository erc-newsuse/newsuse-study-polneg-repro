stages:

  posts:
    cmd: python stages/posts.py
    params:
    - posts
    deps:
    - stages/posts.py
    - data/raw/posts/
    outs:
    - data/proc/posts.parquet:
        persist: true
    - data/proc/posts-text.parquet:
        persist: true

  daily-counts:
    cmd: python stages/daily_counts.py
    deps:
    - stages/daily_counts.py
    - data/proc/posts.parquet
    params:
    - dataset.min_posts_per_day
    outs:
    - data/proc/daily-counts.parquet:
        persist: true

  dataset:
    cmd: python stages/dataset.py
    deps:
    - stages/dataset.py
    - data/proc/posts.parquet
    - data/proc/daily-counts.parquet
    params:
    - dataset.min_posts_per_day
    outs:
    - data/proc/dataset.parquet:
        persist: true
    - data/proc/data-quality.parquet:
        persist: true

  outlet-meta:
    cmd: python stages/outlet_meta.py
    deps:
    - stages/outlet_meta.py
    - data/aux/outlet-meta.xlsx
    outs:
    - data/proc/outlet-meta.parquet:
        persist: true

  political-classify:
    cmd: python stages/ml/political_classify.py
    deps:
    - stages/ml/political_classify.py
    - data/proc/posts.parquet
    - data/proc/posts-text.parquet
    outs:
    - data/proc/cls-political.parquet:
        persist: true

  valence-ground-truth:
    cmd: python stages/ml/valence_ground_truth.py
    deps:
    - stages/ml/valence_ground_truth.py
    - data/aux/valence-ground-truth.json.gz
    outs:
    - data/proc/gpt/valence-ground-truth.parquet:
        persist: true

  valence-requests:
    cmd: python stages/ml/valence_gpt_requests.py
    params:
    - gpt.valence.batch
    deps:
    - stages/ml/valence_gpt_requests.py
    - data/proc/dataset.parquet
    - data/proc/cls-political.parquet
    - data/proc/posts-text.parquet
    - ml/prompts/valence/valence.md
    outs:
    - data/proc/gpt/valence-requests.jsonl.gz:
        persist: true

  valence-jobs:
    cmd: python stages/ml/valence_gpt_jobs.py
    params:
    - gpt.valence.batch
    deps:
    - stages/ml/valence_gpt_jobs.py
    - data/proc/gpt/valence-requests.jsonl.gz
    outs:
    - data/proc/gpt/valence-jobs.jsonl.gz:
        persist: true

  valence-responses:
    cmd: python stages/ml/valence_gpt_responses.py
    deps:
    - stages/ml/valence_gpt_responses.py
    - data/proc/gpt/valence-jobs.jsonl.gz
    outs:
    - data/proc/gpt/valence-responses.jsonl.gz:
        persist: true

  valence-output:
    cmd: python stages/ml/valence_gpt_output.py
    deps:
    - stages/ml/valence_gpt_output.py
    - data/proc/gpt/valence-responses.jsonl.gz
    outs:
    - data/proc/gpt/valence.parquet:
        persist: true

  valence-dataset:
    cmd: python stages/ml/valence_dataset.py
    params:
    - ml.dataset.valence
    deps:
    - stages/ml/valence_dataset.py
    - data/proc/gpt/valence.parquet
    - data/proc/gpt/valence-ground-truth.parquet
    - data/proc/gpt/valence-requests.jsonl.gz
    outs:
    - ml/datasets/valence:
        persist: true

  valence-train:
    cmd: python stages/ml/valence_hyper.py
    params:
    - ml.hyper.valence
    - ml.models.valence
    deps:
    - stages/ml/valence_hyper.py
    - ml/datasets/valence
    outs:
    - data/proc/valence-hyper.parquet:
        persist: true
    - ml/models/valence/best:
        persist: true

  valence-classify:
    cmd: python stages/ml/valence_classify.py
    params:
    - ml.inference
    deps:
    - stages/ml/valence_classify.py
    - data/proc/posts-text.parquet
    - data/proc/valence-hyper.parquet
    outs:
    - data/proc/cls-valence.parquet:
        persist: true

  merge-cls:
    cmd: python stages/merge_cls.py
    deps:
    - stages/merge_cls.py
    - data/proc/cls-political.parquet
    - data/proc/cls-valence.parquet
    outs:
    - data/proc/cls.parquet:
        persist: true

  final:
    cmd: python stages/final.py
    deps:
    - stages/final.py
    - data/proc/dataset.parquet
    - data/proc/cls.parquet
    - data/proc/outlet-meta.parquet
    outs:
    - data/proc/final.parquet:
        persist: true

  descriptives:
    foreach:
    - valence
    - engagement
    do:
      cmd: python stages/descriptives/${item}.py
      deps:
      - stages/descriptives/${item}.py
      - data/proc/final.parquet

  glmm-valence:
    foreach: ["event", "sentiment", "structural"]
    do:
      cmd:
      - TARGET=${item} python stages/glmm/valence.py
      params:
      - glmm.valence.targets.${item}
      deps:
      - stages/glmm/valence.py
      - data/proc/final.parquet
      outs:
      - glmm/valence/${item}.nc:
          persist: true

  glmm-valence-by:
    matrix:
      target: ["event", "sentiment"]
      by: ["quality", "ideology"]
    cmd: TARGET=${item.target} BY=${item.by} python stages/glmm/valence_by.py
    params:
      - glmm.valence.targets.${item.target}
      - glmm.valence.by
    deps:
    - stages/glmm/valence_by.py
    - data/proc/final.parquet
    outs:
      - glmm/valence/${item.target}-${item.by}.nc:
          persist: true

  glmm-engagement:
    foreach: ["reactions", "comments", "shares"]
    do:
      cmd:
      - TARGET=${item} python stages/glmm/engagement.py
      params:
      - glmm.engagement.targets.${item}
      deps:
      - stages/glmm/engagement.py
      - data/proc/final.parquet
      outs:
      - glmm/engagement/${item}.nc:
          persist: true

  glmm-engagement-by:
    matrix:
      target: ["reactions", "comments", "shares"]
      by: ["quality", "ideology"]
    cmd: TARGET=${item.target} BY=${item.by} python stages/glmm/engagement_by.py
    params:
      - glmm.engagement.targets.${item.target}
      - glmm.engagement.by
    deps:
    - stages/glmm/engagement_by.py
    - data/proc/final.parquet
    outs:
      - glmm/engagement/${item.target}-${item.by}.nc:
          persist: true
