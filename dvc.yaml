stages:

  posts:
    cmd: python stages/make_posts.py
    params:
    - posts
    deps:
    - stages/make_posts.py
    - data/raw/posts/
    outs:
    - data/proc/posts.parquet:
        persist: true
    - data/proc/posts-text.parquet:
        persist: true

  daily-counts:
    cmd: python stages/make_daily.py
    deps:
    - stages/make_daily.py
    - data/proc/posts.parquet
    params:
    - dataset.min_posts_per_day
    outs:
    - data/proc/daily.parquet:
        persist: true

  dataset:
    cmd: python stages/make_dataset.py
    deps:
    - stages/make_dataset.py
    - data/proc/posts.parquet
    - data/proc/daily.parquet
    params:
    - dataset.min_posts_per_day
    outs:
    - data/proc/dataset.parquet:
        persist: true
    - data/proc/quality.parquet:
        persist: true

  outlet-meta:
    cmd: python stages/outlet_meta.py
    deps:
    - stages/outlet_meta.py
    - data/raw/outlet-meta.xlsx
    outs:
    - data/proc/outlet-meta.parquet:
        persist: true

  political-classify:
    cmd: python stages/political_classify.py
    deps:
    - stages/ml/political_classify.py
    - data/proc/posts.parquet
    - data/proc/posts-text.parquet
    outs:
    - data/proc/cls-political.parquet:
        persist: true

  valence-ground-truth:
    cmd: python stages/ml/valence_ground_truth.py
    deps:
    - stages/ml/valence_ground_truth.py
    - data/raw/valence-ground-truth.json.gz
    outs:
    - data/proc/gpt/valence-ground-truth.parquet:
        persist: true

  valence-requests:
    cmd: python stages/ml/valence_gpt_requests.py
    params:
    - gpt.valence.batch
    deps:
    - stages/ml/valence_gpt_requests.py
    - data/proc/dataset.parquet
    - data/proc/cls-political.parquet
    - data/proc/posts-text.parquet
    - ml/prompts/valence/valence.md
    outs:
    - data/proc/gpt/valence-requests.jsonl.gz:
        persist: true

  valence-jobs:
    cmd: python stages/ml/valence_gpt_jobs.py
    params:
    - gpt.valence.batch
    deps:
    - stages/ml/valence_gpt_jobs.py
    - data/proc/gpt/valence-requests.jsonl.gz
    outs:
    - data/proc/gpt/valence-jobs.jsonl.gz:
        persist: true

  valence-responses:
    cmd: python stages/ml/valence_gpt_responses.py
    deps:
    - stages/ml/valence_gpt_responses.py
    - data/proc/gpt/valence-jobs.jsonl.gz
    outs:
    - data/proc/gpt/valence-responses.jsonl.gz:
        persist: true

  valence-output:
    cmd: python stages/ml/valence_gpt_output.py
    deps:
    - stages/ml/valence_gpt_output.py
    - data/proc/gpt/valence-responses.jsonl.gz
    outs:
    - data/proc/gpt/valence.parquet:
        persist: true

  valence-dataset:
    cmd: python stages/ml/valence_dataset.py
    params:
    - ml.dataset.valence
    deps:
    - stages/ml/valence_dataset.py
    - data/proc/gpt/valence.parquet
    - data/proc/gpt/valence-ground-truth.parquet
    - data/proc/gpt/valence-requests.jsonl.gz
    outs:
    - ml/datasets/valence:
        persist: true

  valence-train:
    cmd: python stages/ml/valence_hyper.py
    params:
    - ml.hyper.valence
    - ml.models.valence
    deps:
    - stages/ml/valence_hyper.py
    - ml/datasets/valence
    outs:
    - data/proc/valence-hyper.parquet:
        persist: true

  valence-classify:
    cmd: python stages/ml/valence_classify.py
    params:
    - ml.inference
    deps:
    - stages/ml/valence_classify.py
    - data/proc/posts-text.parquet
    - data/proc/valence-hyper.parquet
    outs:
    - data/proc/cls-valence.parquet:
        persist: true

  merge-cls:
    cmd: python stages/merge_cls.py
    deps:
    - stages/merge_cls.py
    - data/proc/cls-political.parquet
    - data/proc/cls-valence.parquet
    outs:
    - data/proc/cls.parquet:
        persist: true

  final:
    cmd: python stages/final.py
    deps:
    - stages/final.py
    - data/proc/dataset.parquet
    - data/proc/cls.parquet
    - data/proc/outlet-meta.parquet
    outs:
    - data/proc/final.parquet:
        persist: true

  glmm:
    foreach:
    - valence
    - reactions
    - comments
    - shares
    do:
      cmd: Rscript stages/glmm_${item}.R
      deps:
      - stages/glmm_${item}.R
      - data/proc/dataset.parquet
      outs:
      - models/glmm/${item}:
          persist: true

  articles-sample:
    cmd: python stages/make_articles_sample.py
    deps:
    - stages/make_articles_sample.py
    - data/raw/articles-sample.xlsx
    outs:
    - data/proc/articles-sample.parquet:
        persist: true

