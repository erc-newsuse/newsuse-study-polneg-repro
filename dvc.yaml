stages:

  posts:
    cmd: python stages/posts.py
    params:
    - posts
    deps:
    - stages/posts.py
    - data/raw/posts/
    outs:
    - data/proc/posts.parquet:
        persist: true
    - data/proc/posts-text.parquet:
        persist: true

  daily-counts:
    cmd: python stages/daily_counts.py
    deps:
    - stages/daily_counts.py
    - data/proc/posts.parquet
    params:
    - dataset.min_posts_per_day
    outs:
    - data/proc/daily-counts.parquet:
        persist: true

  dataset:
    cmd: python stages/dataset.py
    deps:
    - stages/dataset.py
    - data/proc/posts.parquet
    - data/proc/daily-counts.parquet
    params:
    - dataset.min_posts_per_day
    outs:
    - data/proc/dataset.parquet:
        persist: true
    - data/proc/data-quality.parquet:
        persist: true

  outlet-meta:
    cmd: python stages/outlet_meta.py
    deps:
    - stages/outlet_meta.py
    - data/aux/outlet-meta.xlsx
    outs:
    - data/proc/outlet-meta.parquet:
        persist: true

  political-classify:
    cmd: python stages/ml/political_classify.py
    deps:
    - stages/ml/political_classify.py
    - data/proc/posts.parquet
    - data/proc/posts-text.parquet
    outs:
    - data/proc/cls-political.parquet:
        persist: true

  valence-classify:
    cmd: python stages/ml/valence_classify.py
    params:
    - ml.inference
    deps:
    - stages/ml/valence_classify.py
    - data/proc/posts-text.parquet
    - data/proc/valence-hyper.parquet
    outs:
    - data/proc/cls-valence.parquet:
        persist: true

  merge-cls:
    cmd: python stages/merge_cls.py
    deps:
    - stages/merge_cls.py
    - data/proc/cls-political.parquet
    - data/proc/cls-valence.parquet
    outs:
    - data/proc/cls.parquet:
        persist: true

  final:
    cmd: python stages/final.py
    deps:
    - stages/final.py
    - data/proc/dataset.parquet
    - data/proc/cls.parquet
    - data/proc/outlet-meta.parquet
    outs:
    - data/proc/final.parquet:
        persist: true

  descriptives:
    foreach:
    - valence
    - engagement
    do:
      cmd: python stages/descriptives/${item}.py
      deps:
      - stages/descriptives/${item}.py
      - data/proc/final.parquet

  valence-glmm:
    foreach: ["event", "sentiment", "structural"]
    do:
      cmd:
      - TARGET=${item} python stages/glmm/valence.py
      params:
      - glmm.valence.targets.${item}
      deps:
      - stages/glmm/valence.py
      - data/proc/final.parquet
      outs:
      - glmm/valence/${item}.nc:
          persist: true

  valence-validation:
    foreach: ["event", "sentiment", "structural"]
    do:
      cmd:
      - TARGET=${item} python stages/glmm/valence_validation.py
      deps:
      - stages/glmm/valence_validation.py
      - glmm/valence/${item}.nc

  valence-glmm-by:
    matrix:
      target: ["event", "sentiment"]
      by: ["quality", "ideology"]
    cmd: TARGET=${item.target} BY=${item.by} python stages/glmm/valence_by.py
    params:
      - glmm.valence.targets.${item.target}
      - glmm.valence.by
    deps:
    - stages/glmm/valence_by.py
    - data/proc/final.parquet
    outs:
      - glmm/valence/${item.target}-${item.by}.nc:
          persist: true

  valence-analysis:
    foreach: ["event", "sentiment"]
    do:
      cmd: TARGET=${item} python stages/analysis/valence.py
      deps:
      - stages/analysis/valence.py
      - glmm/ppd.nc

  valence-analysis-joint:
    cmd: python stages/analysis/valence_joint.py
    deps:
    - stages/analysis/valence_joint.py
    - glmm/ppd.nc

  engagement-glmm:
    matrix:
      target: ["reactions", "comments", "shares"]
      valence: ["event", "sentiment", "valence"]
    cmd:
    - TARGET=${item.target} VALENCE=${item.valence} python stages/glmm/engagement.py
    params:
    - glmm.engagement.targets.${item.target}
    deps:
    - stages/glmm/engagement.py
    - data/proc/final.parquet
    outs:
    - glmm/engagement/${item.target}-${item.valence}.nc:
        persist: true

  engagement-validation:
    matrix:
      target: ["reactions", "comments", "shares"]
      valence: ["event", "sentiment", "valence"]
    cmd:
    - TARGET=${item.target} VALENCE=${item.valence} python stages/glmm/engagement_validation.py
    deps:
    - stages/glmm/engagement_validation.py
    - glmm/engagement/${item.target}-${item.valence}.nc

  engagement-glmm-by:
    matrix:
      target: ["reactions", "comments", "shares"]
      valence: ["valence"]
      by: ["quality", "ideology"]
    cmd: TARGET=${item.target} VALENCE=${item.valence} BY=${item.by} python stages/glmm/engagement_by.py
    params:
      - glmm.engagement.targets.${item.target}
      - glmm.engagement.by
    deps:
    - stages/glmm/engagement_by.py
    - data/proc/final.parquet
    outs:
      - glmm/engagement/${item.target}-${item.valence}-${item.by}.nc:
          persist: true

  engagement-analysis:
    foreach: ["reactions", "comments", "shares"]
    do:
      cmd: TARGET=${item} python stages/analysis/engagement.py
      deps:
      - stages/analysis/engagement.py
      - glmm/ppd.nc

  engagement-analysis-effects:
    foreach: ["reactions", "comments", "shares"]
    do:
      cmd: TARGET=${item} python stages/analysis/engagement_effects.py
      deps:
      - stages/analysis/engagement_effects.py
      - glmm/ppd.nc

  ppd:
    cmd: python stages/glmm/ppd.py
    deps:
    - stages/glmm/ppd.py
    - glmm/valence
    - glmm/engagement
    outs:
    - glmm/ppd.nc:
        persist: true
