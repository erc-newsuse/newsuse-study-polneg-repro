        glmm.valence.targets.event:
          index_col: key
          predictors:
            fixed:
            - political
            - country
            groups:
            - outlet
            - time
          model:
            formula: "{target} ~ 1\n  + political + country + political:country\n\
              \  + (1 + political || outlet)\n  + (1 + political || country:time)\n"
            family: cumulative
            link: logit
            prior:
            - prior: student_t(3, 0, 2)
              class: b
            - prior: student_t(3, 0, 2)
              class: Intercept
          n_threads: 4
          solver:
            algorithm: meanfield
            chains: 4
            cores: 4
            iter: 2000
            backend: cmdstanr
          inference:
            subsample: 500000
            ppd:
              ndraws: 250
              cores: 4
            epd:
              re_formulas:
                grand_mean: ~0
                outlets: ~(1 + political || outlet)
                full:
              support:
              - -1
              - 0
              - 1
              allow_new_levels: true
              sample_new_levels: gaussian
            loglik:
              ndraws: 250
              cores: 4
            ranef:
              ndraws: 50
              cores: 4
          seed: 1742380
