    params:
      params.yaml:
        glmm.valence.targets.event:
          index_col: key
          predictors:
            fixed:
            - political
            - country
            - weekend
            groups:
            - outlet
            - isotime
          model:
            formula: "{target} ~ 1\n  + political * country + weekend\n  + (1 | outlet:political)\n\
              \  + (1 | country:isotime:political)\n"
            family: mixture(gaussian, gaussian)
            link: logit
            prior:
            - normal(-2, 2), class = Intercept, dpar = mu1
            - normal(2, 2), class = Intercept, dpar = mu2
          n_threads: 4
          solver:
            algorithm: meanfield
            chains: 4
            cores: 4
            iter: 2000
            backend: cmdstanr
            control: {}
          inference:
            subsample: 500000
            ppd:
              ndraws: 10
              cores: 4
            pop:
              allow_new_levels: true
              sample_new_levels: old_levels
              group_name: population_posterior_predictive
              re_formula: ~0
            epd:
              re_formulas:
                grand_mean: ~0
                full:
              allow_new_levels: true
              sample_new_levels: gaussian
            loglik:
              ndraws: 10
              cores: 4
            ranef:
              ndraws: 50
              cores: 4
          seed: 1289326
