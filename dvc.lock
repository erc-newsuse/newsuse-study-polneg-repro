    - path: stages/ml/valence_hyper.py
      hash: md5
      md5: 469c7ff8bfc400aabff3409ce266ede5
      size: 4366
    params:
      params.yaml:
        ml.hyper.valence:
          study:
            direction: maximize
            load_if_exists: ${eval:${oc.env:NEWSUSE_OPTUNA_RESUME,1}}
            study_name: valence
          optimize:
            n_jobs: ${eval:${oc.env:NEWSUSE_OPTUNA_N_JOBS,1}}
            n_trials: ${eval:${oc.env:NEWSUSE_OPTUNA_N_TRIALS,50}}
            show_progress_bar: true
          space:
            newsuse:
              base:
                type: categorical
                choices:
                - xlm-large
              ordinal_logit_bias_scale:
                type: float
                low: 1.0
                high: 8.0
                step: 0.5
              num_shared_layers:
                type: int
                low: 0
                high: 0
              num_head_layers:
                type: int
                low: 0
                high: 4
              head_poolers:
                type: categorical
                choices:
                - true
                - false
              dropout:
                type: float
                low: 0.0
                high: 0.3
                step: 0.05
            args:
              learning_rate:
                type: float
                low: 1e-07
                high: 0.0001
                log: true
              warmup_ratio:
                type: float
                low: 0
                high: 0.5
                step: ${eval:1 / ${ml.training.arguments.num_train_epochs}}
              weight_decay:
                type: float
                low: 0
                high: 0.01
                step: 0.002
              lr_scheduler_type:
                type: categorical
                choices:
                - linear
                - cosine
                - cosine_with_restarts
              seed:
                type: categorical
                choices:
                - 923416180
                - 947936097
                - 913180696
                - 107285332
                - 325748676
                - 1364790667
                - 2894555970
                - 365673098
                - 415169889
                - 3396084250
        ml.models.valence:
          defaults:
            base: &id005 {}
            newsuse: &id006 {}
            tokenize: &id007
              padding: max_length
              truncation: true
            training: &id008
              callbacks:
              - make!: transformers:EarlyStoppingCallback
                early_stopping_patience: 2
              arguments:
                make!: transformers:TrainingArguments
                num_train_epochs: ${eval:${oc.env:NEWSUSE_NUM_TRAIN_EPOCHS,10}}
                per_device_eval_batch_size:
                  ${eval:${oc.env:NEWSUSE_PER_DEVICE_EVAL_BATCH_SIZE,32}}
                per_device_train_batch_size:
                  ${eval:${oc.env:NEWSUSE_PER_DEVICE_TRAIN_BATCH_SIZE,16}}
                learning_rate: 1e-06
                seed: 303
                gradient_checkpointing:
                  ${eval:${oc.env:NEWSUSE_GRADIENT_CHECKPOINTING,1}}
                fp16: ${eval:${oc.env:NEWSUSE_FP16,1}}
                metric_for_best_model: loss
                save_strategy: epoch
                eval_strategy: epoch
                eval_on_start: true
                logging_strategy: epoch
                load_best_model_at_end: true
                overwrite_output_dir: true
          distilbert:
            base: *id005
            newsuse: *id006
            tokenize: *id007
            training: *id008
            checkpoint: distilbert-base-multilingual-cased
          xlm-large:
            base: *id005
            newsuse: *id006
            tokenize: *id007
            training: *id008
            checkpoint: xlm-roberta-large
