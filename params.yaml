paths:
  make!:            "newsuse.config:Paths"
  data:             "data"
  raw:              "@data/raw"
  proc:             "@data/proc"
  posts:            "@proc/posts.parquet"
  text:             "@proc/posts-text.parquet"
  dataset:          "@proc/dataset.parquet"
  daily_counts:     "@proc/daily-counts.parquet"
  quality:          "@proc/data-quality.parquet"
  outlet_meta:      "@proc/outlet-meta.parquet"
  cls_political:    "@proc/cls-political.parquet"
  cls_valence:      "@proc/cls-valence.parquet"
  labels:           "@proc/cls.parquet"
  final:            "@proc/final.parquet"
  articles_sample:  "@proc/articles-sample.parquet"
  predictions:      "@proc/predictions.parquet"
  followers:        "@raw/followers.parquet"
  mldata:           "@data/ml"
  ml:               "ml"
  glmm:             "glmm"
  figures:          "figures"
  prompts:          "@ml/prompts"
  gpt:              "@proc/gpt/"
  annotations:      "annotations"
  valence_hyper:     "@proc/valence-hyper.parquet"
  analyses:          "analyses"

categorical:
  countries:
    us:  United States
    uk:  United Kingdom
    irl: Ireland
    pl:  Poland
    fr:  France
    esp: Spain
  political:
    categories: ["OTHER", "POLITICAL"]
  valence:
    categories: [-1, 0, 1]
    ordered: true

countries:
  order:
  - us
  - esp
  - fr
  - pl
  - irl
  - uk
  labels:
    us:  United States
    esp: Spain
    fr:  France
    pl:  Poland
    irl: Ireland
    uk:  United Kingdom

annotations:
  political:
    categories:
    - OTHER
    - POLITICAL
  valence:
    categories: [-1, 0, 1]
    ordered: true

posts:
  start_date: "2020-01-01"
  end_date: "2024-04-01"

dataset:
  usecols:
  - key
  - country
  - name
  - timestamp
  - type
  - has_snippet
  - likes
  - reactions_LIKE
  - reactions_LOVE
  - reactions_WOW
  - reactions_HAHA
  - reactions_ANGRY
  - reactions_SAD
  - comments
  - shares
  - ini
  - post_url
  min_posts_per_day: 2

glmm:
  valence:
    defaults: &glmm_valence_defaults
      subsample: 200_000
      index_col: key
      predictors: ["country", "political", "outlet", "time"]
      formula: >
        {target} ~ 1
          + country * political
          + (1 + political || outlet)
          + (1 + political || country:time)
      family: cumulative
      link: logit
      algorithm: meanfield
      chains: &glmm_valence_chains
        4
      cores: *glmm_valence_chains
      n_threads: &glmm_valence_n_threads
        4
      iter: 2000
      backend: cmdstanr
      ppd: &glmm_valence_ppd
        ndraws: 10
        cores: *glmm_valence_n_threads
      epd:
        <<: *glmm_valence_ppd
        support: [-1, 0, 1]
      loglik:
        <<: *glmm_valence_ppd
      ranef:
        ndraws: 50
    event:
      <<: *glmm_valence_defaults
      seed: 1742380
    sentiment:
      <<: *glmm_valence_defaults
      seed: 4823917
    valence:
      <<: *glmm_valence_defaults
      seed: 9534621

classification:
  political:
    model:
      source: huggingface
      name: sztal/erc-newsuse-political

articles_sample:
  groupsize: 10

gpt:
  header: &gpt_default_header
    method: POST
    url: /v1/responses
  batch_size: &gpt_default_batch_size 2500
  valence:
    experiment:
      params:
        gpt-5:
          model:
            - gpt-5
            - gpt-5-mini
            - gpt-5-nano
          reasoning:
            - effort: minimal
            - effort: low
            - effort: medium
            - effort: high
          text:
            - verbosity: low
        gpt-4.1:
          model:
            - gpt-4.1
            - gpt-4.1-mini
            - gpt-4.1-nano
          temperature:
            - 0.0
      prompts:
        - valence.md
        - event.md
        - sentiment.md
      header:
        <<: *gpt_default_header
      batch_size: *gpt_default_batch_size
    batch:
      params: &gpt_batch_params
        model: gpt-5
        reasoning:
          effort: medium
        text:
          verbosity: medium
      header:
          <<: *gpt_default_header
      batch_size: *gpt_default_batch_size
      sample:
        size_per_group: 2000
        min_words: 5
        countries: []
        political:
          - OTHER
          - POLITICAL
        seed: 535017
      targets:
        event:
          <<: *gpt_batch_params
        sentiment:
          <<: *gpt_batch_params

inference:
  alpha: 0.05
  conf: ${eval:1-${.alpha}}
  adjust: holm

ml:
  dataset:
    defaults: &ml_dataset_defaults
      training: 0.8
      testing: 0.1
      validation: 0.1
    valence:
      <<: *ml_dataset_defaults
      seed: 34280
  inference:
    batch_size: ${eval:${oc.env:NEWSUSE_ML_INFERENCE_BATCH_SIZE,32}}
  tokenize: &ml_tokenize_defaults
    padding: max_length
    truncation: true
  training: &ml_training_defaults
    callbacks:
      - make!: transformers:EarlyStoppingCallback
        early_stopping_patience: 2
    arguments: &ml_training_arguments_defaults
      make!: transformers:TrainingArguments
      num_train_epochs: ${eval:${oc.env:NEWSUSE_NUM_TRAIN_EPOCHS,10}}
      per_device_eval_batch_size: ${eval:${oc.env:NEWSUSE_PER_DEVICE_EVAL_BATCH_SIZE,32}}
      per_device_train_batch_size: ${eval:${oc.env:NEWSUSE_PER_DEVICE_TRAIN_BATCH_SIZE,16}}
      learning_rate: 1e-6
      seed: 303
      gradient_checkpointing: ${eval:${oc.env:NEWSUSE_GRADIENT_CHECKPOINTING,1}}
      fp16: ${eval:${oc.env:NEWSUSE_FP16,1}}
      metric_for_best_model: loss
      save_strategy: epoch
      eval_strategy: epoch
      eval_on_start: true
      logging_strategy: epoch
      load_best_model_at_end: true
      overwrite_output_dir: true
  hyper:
    defaults: &ml_hyper_defaults
      study: &ml_hyper_study_defaults
        direction: maximize
        load_if_exists: ${eval:${oc.env:NEWSUSE_OPTUNA_RESUME,1}}
      optimize:
        n_jobs: ${eval:${oc.env:NEWSUSE_OPTUNA_N_JOBS,1}}
        n_trials: ${eval:${oc.env:NEWSUSE_OPTUNA_N_TRIALS,50}}
        show_progress_bar: true
      space:
        newsuse:
          base:
            type: categorical
            choices:
            # - distilbert
            - xlm-large
          ordinal_logit_bias_scale:
            type: float
            low: 1.0
            high: 8.0
            step: 0.5
          num_shared_layers:
            type: int
            low: 0
            high: 0
          num_head_layers:
            type: int
            low: 0
            high: 4
          head_poolers:
            type: categorical
            choices:
            - true
            - false
          dropout:
            type: float
            low: 0.0
            high: 0.3
            step: 0.05
        args:
          learning_rate:
            type: float
            low: 1e-7
            high: 1e-4
            log: true
          warmup_ratio:
            type: float
            low: 0
            high: 0.5
            step: ${eval:1 / ${ml.training.arguments.num_train_epochs}}
          weight_decay:
            type: float
            low: 0
            high: 0.01
            step: 0.002
          lr_scheduler_type:
            type: categorical
            choices:
            - linear
            - cosine
            - cosine_with_restarts
          seed:
            type: categorical
            choices:
            - 923416180
            - 947936097
            - 913180696
            - 107285332
            - 325748676
            - 1364790667
            - 2894555970
            - 365673098
            - 415169889
            - 3396084250
    valence:
      <<: *ml_hyper_defaults
      study:
        study_name: valence
        <<: *ml_hyper_study_defaults
  models:
    valence:
      defaults: &ml_model_valence_defaults
        base: {}
        newsuse: {}
        tokenize:
          <<: *ml_tokenize_defaults
        training:
          <<: *ml_training_defaults
          arguments:
            <<: *ml_training_arguments_defaults
      distilbert:
        checkpoint: distilbert-base-multilingual-cased
        <<: *ml_model_valence_defaults
      xlm-large:
        checkpoint: xlm-roberta-large
        <<: *ml_model_valence_defaults

xarray:
  display_style: text

arviz:
  data.load: eager
  stats.ci_prob: 0.95

plotting:
  style:  tableau-colorblind10
  usetex: true
  color:
    palette:
      gold:       "#ecc00f"
      red:        "#f10d71"
      green:      "#7adf06"
      blue:       "#5bbdff"
      brown:      "#ae6f4a"
      teal:       "#1cdae4"
      purple:     "#c618cc"
      white:      "white"
      gray:       "#bdbaba"
      black:      "black"
    semantics:
      other:         ${..palette.gray}
      political:     ${..palette.gold}
      negative:      ${..palette.red}
      non-political: ${.other}
      non-negative:  ${.other}
      valence:    ${.negative}
      overall:       ${..palette.black}
      us:            ${..palette.blue}
      esp:           ${..palette.gold}
      fr:            ${..palette.gray}
      pl:            ${..palette.red}
      irl:           ${..palette.green}
      uk:            ${..palette.brown}
  params:
    font.family:           sans-serif
    # font.sans-serif:       Montserrat
    text.usetex:           ${..usetex}
    text.latex.preamble:   \usepackage{amsmath,amsfonts,amssymb,sfmath,xcolor}
    figure.figsize:        [5, 5]
    figure.labelsize:      x-large
    figure.titlesize:      xx-large
    figure.titleweight:    bold
    figure.dpi:            300
    savefig.bbox:          tight
    axes.grid:             false
    axes.axisbelow:        true
    axes.titleweight:      bold
    axes.titlesize:        large
    axes.labelsize:        large
    scatter.marker:        o
    scatter.edgecolors:    black
    lines.markeredgecolor: black
    lines.markeredgewidth: 1
